<!DOCTYPE html>

<style>
  /* Local to this dashboard; everything else is review-stats.css. */
  col.c-bug { width: 90px; }
  col.c-did { width: 34%; }
  col.c-date { width: 96px; }
  #queue-table td { overflow-wrap: anywhere; }
  td .sub { display: block; color: var(--muted); font-size: 11.5px; margin-top: 3px; }
  td .did { display: block; }
  td .did + .did { margin-top: 3px; }
  .tag { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.08em;
          padding: 1px 6px; border-radius: 999px; background: var(--paper-warm); color: var(--ink-soft); }
  .tag.closed, .tag.moved { background: var(--red); color: var(--surface); }
  .empty { color: var(--muted); font-size: 12.5px; margin: 0; }
  .dry-run { color: var(--red-deep); }
  .stat.expandable:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }
</style>

<div class="top-bar">
  <header>
    <h1><a href="../index.html" title="Back to team picker">←</a><span class="dash-title">Triage Dashboard</span> <span style="color: var(--muted); font-variation-settings: 'opsz' 110, 'wght' 300; font-style: italic;">·</span> <span id="header-group">__TEAM__</span></h1>
    <div class="meta" id="header-meta"></div>
  </header>
  <nav class="toggle-bar" aria-label="Week selector">
    <div class="toggle-group" role="tablist" aria-label="Week" id="weeks"></div>
  </nav>
</div>

<main>
  <section>
    <h2 id="week-title"></h2>
    <div class="summary-grid" id="tiles"></div>
  </section>
  <section>
    <h2 id="table-title">What the bot changed</h2>
    <div id="table"></div>
  </section>
</main>

<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
// Display text per category; the order comes from DATA.categories, riskiest first.
const TEXT = {
  all: ["All bugs", "every bug it changed"],
  closed: ["Closed", "check first: a wrong close hides a bug"],
  moved: ["Moved", "left the team's components"],
  sp: ["S/P set", "severity or priority"],
  needinfo: ["Asked for info", "waiting on a person"],
};
const TILES = ["all", ...DATA.categories].map(k => [k, ...TEXT[k]]);
const state = {week: DATA.weeks.length ? DATA.weeks[0].key : null, filter: "all"};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const bug = id => `<a href="https://bugzilla.mozilla.org/show_bug.cgi?id=${id}">${id}</a>`;
const bugList = ids => ids.map(bug).join(", ");
const day = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-US", {month: "short", day: "numeric"});
const week = () => DATA.weeks.find(w => w.key === state.week);
const ROLES = {reporter: "reporter", assignee: "assignee", other: "another person", unknown: "unknown person"};

// The tagged line for each of the row's categories, in risk order.
const TAGGED = {
  closed: r => `<span class="tag closed">closed</span> ${esc(r.resolution)}${r.dupe_of ? " of " + bug(r.dupe_of) : ""}`,
  moved: r => `<span class="tag moved">moved</span> to ${esc(r.move_to)}`,
  sp: r => `<span class="tag">S/P</span> ${esc([r.severity, r.priority].filter(Boolean).join(" / "))}`,
  needinfo: r => `<span class="tag">needinfo</span> ${esc(r.needinfo.map(x => ROLES[x] || x).join(", "))}`,
};

// One line per change the bot made, most harmful first.
function changes(r) {
  const lines = [
    ...r.categories.map(c => TAGGED[c](r)),
    r.blocks_add.length && `blocks ${bugList(r.blocks_add)}`,
    r.regressed_by_add.length && `regressed by ${bugList(r.regressed_by_add)}`,
    r.keywords_add.length && `keywords ${esc(r.keywords_add.join(", "))}`,
    ...r.other_bugs.map(o => `on ${bug(o.bug_id)}: blocks ${bugList(o.blocks_add)}`),
  ].filter(Boolean);
  return (lines.length ? lines : ["comment only, no field change"]).map(l => `<span class="did">${l}</span>`).join("");
}

function draw() {
  document.getElementById("weeks").innerHTML = DATA.weeks.map(w =>
    `<button type="button" data-week="${w.key}" class="${w.key === state.week ? "active" : ""}">${w.key.slice(5)} · ${day(w.start)}</button>`).join("");
  const w = week();
  if (!w) {
    document.getElementById("week-title").textContent = "No runs yet";
    document.getElementById("tiles").innerHTML = "";
    document.getElementById("table").innerHTML = `<p class="empty">The bot has not changed any bug of this team yet.</p>`;
    return;
  }
  document.getElementById("week-title").textContent = `Week ${w.key.slice(5)} · ${day(w.start)} to ${day(w.end)}`;
  document.getElementById("tiles").innerHTML = TILES.map(([k, label, sub]) =>
    `<div class="stat expandable${state.filter === k ? " is-open" : ""}" data-filter="${k}" role="button" tabindex="0" aria-pressed="${state.filter === k}">
      <div class="label">${label}</div><div class="value">${w.counts[k]}</div><div class="sub">${sub}</div></div>`).join("");
  const rows = w.rows.filter(r => state.filter === "all" || r.categories.includes(state.filter));
  const label = TILES.find(([k]) => k === state.filter)[1];
  document.getElementById("table-title").textContent = state.filter === "all" ? "What the bot changed" : `What the bot changed · ${label}`;
  document.getElementById("table").innerHTML = rows.length ? `<div class="table-wrap"><table id="queue-table">
    <colgroup><col class="c-bug"><col><col class="c-did"><col class="c-date"></colgroup>
    <thead><tr><th>Bug</th><th>Title</th><th>What the bot did</th><th>Date</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${bug(r.bug_id)}</td><td>${esc(r.title)}<span class="sub">${esc(r.summary)}</span></td>
      <td>${changes(r)}</td><td>${day(r.started_at.slice(0, 10))}</td></tr>`).join("")}</tbody></table></div>`
    : `<p class="empty">No bug is in “${label}” this week. Choose “All bugs” to see every change.</p>`;
  history.replaceState(null, "", `#${state.week}`);
}

function readHash() {
  const key = location.hash.slice(1);
  if (DATA.weeks.some(w => w.key === key)) state.week = key;
}

function pick(el) {
  if (el.dataset.week) { state.week = el.dataset.week; state.filter = "all"; }
  if (el.dataset.filter) state.filter = state.filter === el.dataset.filter ? "all" : el.dataset.filter;
  draw();
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-week], [data-filter]");
  if (el) pick(el);
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const el = e.target.closest && e.target.closest("[data-filter]");
  if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pick(el); return; }
  if ((e.key !== "ArrowLeft" && e.key !== "ArrowRight") || !DATA.weeks.length) return;
  const i = DATA.weeks.findIndex(w => w.key === state.week);
  const next = i + (e.key === "ArrowRight" ? -1 : 1);
  if (next < 0 || next >= DATA.weeks.length) return;
  state.week = DATA.weeks[next].key;
  state.filter = "all";
  draw();
});
window.addEventListener("hashchange", () => { readHash(); draw(); });

document.getElementById("header-meta").innerHTML = `__LABEL__ · data as of ${esc(DATA.as_of.replace("T", " ").slice(0, 16))} UTC`
  + (DATA.posted ? "" : ` · <span class="dry-run">dry run: nothing was posted to Bugzilla</span>`)
  + ` · Left/Right change the week`;
readHash();
draw();
</script>
</body>
</html>
