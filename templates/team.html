<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triage Dashboard · __TEAM__</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../review-stats.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  /* Local to this dashboard; everything else is review-stats.css. */
  /* Keep room for the scrollbar in both views, so the centered page does not jump
     sideways when one view is short enough to need no scrollbar. */
  html { scrollbar-gutter: stable; }
  .chart-box { position: relative; height: 280px; }
  /* A bar chart grows with its rows (--rows, set by the script), so bars stay thin. */
  .chart-box.rows { height: max(120px, calc(var(--rows) * 34px + 40px)); }
  .chart-note { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-soft); }
  button.stat { font: inherit; text-align: left; border: 0; width: 100%; color: inherit; }
  /* minmax(0, ...) lets a Chart.js canvas shrink with its column. */
  .split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .filters .lw-filters { margin: 0; }
  .filters input { margin-left: auto; width: 240px; font-family: var(--mono); font-size: 11px; color: var(--ink);
    border: 1px solid var(--rule); background: var(--surface); padding: 4px 8px; border-radius: 2px; }
  .layout { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 10px; align-items: start; }
  .rail, .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 2px; }
  .card { padding: 16px 20px 18px; }
  .rail { position: sticky; top: 92px; max-height: calc(100vh - 110px); overflow-y: auto; }
  .pos { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .rail ol { list-style: none; margin: 0; padding: 0; }
  .rail-item { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); background: none;
    border: 0; border-bottom: 1px solid var(--rule-soft); padding: 9px 14px 10px; cursor: pointer; }
  /* Room for the sticky day header when a step scrolls a row into view. */
  .rail-item { scroll-margin-top: 32px; }
  .rail-item:hover { background: var(--paper); }
  .rail-item.is-active { background: var(--paper-warm); box-shadow: inset 3px 0 0 var(--red); }
  .rail-item:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }
  .rail-row1 { display: flex; align-items: baseline; gap: 8px; }
  .rail-id { font-family: var(--mono); font-size: 11.5px; font-weight: 600; }
  .rail li { position: relative; }
  /* A quiet band that stays at the top of the list while its day scrolls. */
  .rail-day { position: sticky; top: 0; z-index: 1; margin: 0; padding: 12px 14px 5px; color: var(--muted);
    background: var(--paper); border-bottom: 1px solid var(--rule-soft); }
  /* The bug link sits over the row's number, as a sibling of the row's button: a link
     cannot be inside a button. The number in the button only holds the space. */
  .rail-link { position: absolute; top: 9px; left: 14px; font-family: var(--mono); font-size: 11.5px; font-weight: 600; }
  .rail-item .rail-id { visibility: hidden; }
  .rail-group li:has(> .is-active) .rail-link { color: var(--red-deep); }
  .rail-tags { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 3px; margin-left: auto; }
  .rail-title { font-size: 12.5px; line-height: 1.35; margin-top: 3px; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* Tags, in the triage dashboard's style: small soft pills, one color per meaning. A
     category pill gets its color from the data (--c); the harmful one is solid. */
  .tag, .rail-cat, .when, .card-meta, .changes dt, .rail-day, .ni-role { font-family: var(--mono); font-size: 9.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; }
  .tag { padding: 1px 6px; border-radius: 3px; background: var(--paper-warm); color: var(--ink-soft); white-space: nowrap; }
  .tag.new { background: rgba(63, 94, 63, 0.14); color: #3F5E3F; }
  .tag.regression { background: rgba(200, 155, 60, 0.2); color: #7A5A12; }
  .tag.outline { background: transparent; box-shadow: inset 0 0 0 1px var(--rule); }
  .tag.partly { background: transparent; color: var(--red-deep); box-shadow: inset 0 0 0 1px var(--red); }
  .notice { margin: 0 0 14px; padding: 8px 12px; border-left: 3px solid var(--red); background: rgba(255, 0, 57, 0.06);
    color: var(--red-deep); font-size: 12.5px; line-height: 1.5; }
  .tag.cat { background: color-mix(in srgb, var(--c) 13%, transparent); color: color-mix(in srgb, var(--c) 80%, black); }
  .tag.cat.harm { background: var(--c); color: var(--surface); }
  .rail-cat, .changes dt, .ni-role { color: var(--muted); font-weight: 500; }
  .rail-cat { white-space: nowrap; }
  /* Anything that takes a bug off the team. */
  .rail-cat.harm, .changes dt.harm { color: var(--red-deep); font-weight: 600; }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .card-id { font-family: var(--mono); font-size: 12px; font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pos button { font: inherit; color: var(--ink-soft); background: var(--surface); border: 1px solid var(--rule); border-radius: 2px; cursor: pointer; padding: 0 6px; }
  .card-title { font-family: var(--serif); font-variation-settings: "opsz" 30, "wght" 600, "SOFT" 30;
    font-size: 19px; line-height: 1.3; margin: 0 0 14px; overflow-wrap: anywhere; }
  .card-meta { color: var(--muted); margin: -8px 0 14px; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline > li { border-top: 1px solid var(--rule-soft); padding: 10px 0; }
  .timeline > li + li { margin-top: 12px; padding-top: 14px; }
  .when { color: var(--muted); margin-bottom: 8px; }
  .timeline > li:first-child .when { color: var(--ink); }
  .changes { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; margin: 0; font-size: 13px; line-height: 1.5; }
  .changes dt { padding-top: 3px; }
  .changes dd { margin: 0; overflow-wrap: anywhere; }
  .ni-chip { display: inline-flex; align-items: baseline; gap: 6px; margin: 0 6px 4px 0; padding: 1px 8px;
    border: 1px solid var(--rule); border-radius: 3px; background: var(--paper); }
  .comment { margin-top: 12px; padding: 2px 14px; background: var(--paper); border-left: 2px solid var(--rule);
    font-size: 12.5px; line-height: 1.55; color: var(--ink-soft); overflow-wrap: anywhere; }
  .comment p, .comment ol, .comment ul { margin: 8px 0; }
  .comment ol, .comment ul { padding-left: 20px; }
  .comment hr { border: 0; border-top: 1px solid var(--rule); margin: 10px 0; }
  .comment code { font-family: var(--mono); font-size: 11.5px; }
  footer.keys { max-width: 1200px; margin: 0 auto; padding: 0 40px 32px; font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.04em; color: var(--muted); }
  .card a, .bug-link { color: inherit; text-decoration: none; border-bottom: 1px solid var(--rule); }
  .card a:hover, .bug-link:hover { color: var(--red); border-bottom-color: var(--red); }
  .empty { color: var(--muted); font-size: 12.5px; margin: 0; padding: 14px; }
  .dry-run { color: var(--red-deep); }
  [hidden] { display: none !important; }
  @media (max-width: 800px) {
    .layout, .split { grid-template-columns: 1fr; }
    .rail { position: static; max-height: 45vh; }
    .filters input { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <header>
    <h1><a href="../index.html" title="Back to team picker">←</a><span class="dash-title">Triage Dashboard</span> <span style="color: var(--muted); font-variation-settings: 'opsz' 110, 'wght' 300; font-style: italic;">·</span> <span id="header-group">__TEAM__</span></h1>
    <div class="meta" id="header-meta"></div>
  </header>
  <nav class="toggle-bar" aria-label="View and period selectors">
    <div class="toggle-group" role="tablist" aria-label="View" id="views"></div>
    <div class="toggle-sep" aria-hidden="true"></div>
    <div class="toggle-group" role="tablist" aria-label="Period" id="periods"></div>
  </nav>
</div>

<main>
  <div id="overview-view">
    <section>
      <h2 id="summary-title"></h2>
      <div class="summary-grid" id="summary-grid"></div>
    </section>
    <section>
      <h2>Bugs handled per day</h2>
      <div class="chart-box"><canvas id="chart-daily" role="img"></canvas></div>
    </section>
    <section>
      <h2>Issue types</h2>
      <div class="chart-box rows"><canvas id="chart-issue" role="img" aria-label="Bugs by issue type"></canvas></div>
      <p class="chart-note" id="issue-notes"></p>
    </section>
    <section>
      <div class="split">
        <div><h2>Close / Reassign: where the bugs went</h2><div class="chart-box rows"><canvas id="chart-close"></canvas></div></div>
        <div><h2>Severity the bot set</h2><div class="chart-box rows"><canvas id="chart-severity"></canvas></div></div>
      </div>

  <div id="bugs-view" hidden>
    <div class="filters">

</main>
<footer class="keys">Left/Right: view · Shift+Left/Right: period · in Bugs, Up/Down or j/k: next bug · /: search</footer>

<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const VIEWS = [["overview", "Overview"], ["bugs", "Bugs"]];
const PERIODS = DATA.periods.map(p => [p.key, p.label]);
const CAT = Object.fromEntries(DATA.categories.map(c => [c.key, c]));
const CAT_TEXT = {all: "All", ...Object.fromEntries(DATA.categories.map(c => [c.key, c.label]))};
const CATS = ["all", ...DATA.categories.map(c => c.key)];
const ROLES = {reporter: "reporter", assignee: "assignee", other: "another person", unknown: "unknown person"};
// Each tag the page can show, in display order: its CSS class, and whether the short view
// shows it. The short view keeps only the tags that change what to look at first.
const TAGS = {rejected: {cls: "partly", rail: true}, "apply failed": {cls: "partly", rail: true},
  "partly posted": {cls: "partly", rail: true},
  regression: {cls: "regression", rail: true}, new: {cls: "new", rail: true},
  "dev needinfo": {cls: "outline"}, again: {cls: "outline"}};
const state = {view: "overview", period: "1w", cat: "all", q: "", bug: null, issue: ""};
// Run sources are named only once Hackbot runs exist; until then every run is local.
const HAS_HACKBOT = DATA.bugs.some(b => b.runs.some(r => r.source === "hackbot"));

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const bugUrl = (id, anchor = "") => `https://bugzilla.mozilla.org/show_bug.cgi?id=${id}${anchor}`;
const link = (href, text, cls = "") => `<a${cls ? ` class="${cls}"` : ""} href="${href}" target="_blank" rel="noopener">${text}</a>`;
const bug = (id, cls = "bug-link") => link(bugUrl(id), id, cls);
const bugList = ids => ids.map(bug).join(", ");
const DAY_MS = 864e5;
// Dates are shown, and runs are put into days, in the viewer's own time zone.
const day = d => new Date(d).toLocaleDateString("en-US", {month: "short", day: "numeric"});
const dayKey = d => new Date(d).toLocaleDateString("en-CA");
// Like day(), plus the year when it is not this year.
const date = d => {
  const year = new Date(d).getFullYear();
  return year === new Date().getFullYear() ? day(d) : `${day(d)}, ${year}`;
};
// Whole local calendar days from `a` to `b`.
const daysBetween = (a, b) => (new Date(dayKey(b)) - new Date(dayKey(a))) / DAY_MS;
// "Today", "Yesterday", else the date: the viewer's local calendar day, read at each draw.
const dayLabel = d => {
  const n = daysBetween(d, Date.now());
  return n === 0 ? "Today" : n === 1 ? "Yesterday" : date(d);
};
const time = d => new Date(d).toLocaleTimeString("en-US", {hour: "2-digit", minute: "2-digit", hour12: false});
// Whole local days from the bug's filing to the bot's first run on it.
const waited = (filed, firstRun) => {
  const n = daysBetween(filed, firstRun);
  return n <= 0 ? "triaged the same day" : `triaged ${n} ${n === 1 ? "day" : "days"} later`;
};
const tag = t => `<span class="tag ${TAGS[t].cls}">${esc(t)}</span>`;
const TAG_ORDER = Object.keys(TAGS);
const tags = (list, keep = () => true) => TAG_ORDER.filter(t => keep(t) && list.includes(t)).map(tag).join("");
const harm = key => CAT[key].harm ? " harm" : "";
const catTag = key => `<span class="tag cat${harm(key)}" style="--c: ${CAT[key].color}">${esc(CAT[key].label)}</span>`;
const period = () => DATA.periods.find(p => p.key === state.period);

// ---- Overview ----
const openBugs = (cat, issue = "") => Object.assign(state, {view: "bugs", cat, issue});
const charts = {};
function chart(id, config) {
  charts[id]?.destroy();
  charts[id] = new Chart(document.getElementById(id), {...config, options: {maintainAspectRatio: false, ...config.options}});
}
// Thin bars whatever the row count: the box grows with the rows instead.
// `onPick(label)`, when given, runs on a click on a bar.
function horizontalBar(id, counts, color, onPick) {
  const labels = Object.keys(counts);
  document.getElementById(id).parentElement.style.setProperty("--rows", labels.length);
  chart(id, {type: "bar", data: {labels, datasets: [{data: labels.map(k => counts[k]), backgroundColor: color, maxBarThickness: 18}]},
    options: {indexAxis: "y", plugins: {legend: {display: false}},
      onClick: onPick && ((_, items) => items.length && onPick(labels[items[0].index])),
      onHover: onPick && ((e, items) => { e.native.target.style.cursor = items.length ? "pointer" : "default"; }),
      scales: {x: {beginAtZero: true, ticks: {precision: 0}}, y: {grid: {display: false}}}}});
}
const RAN_DAYS = new Set(DATA.ran_at.map(dayKey));
const KNOWN_UNTIL = dayKey(DATA.known_until);
const MARKS = {"0": "Ran, no bug to triage", "×": "No run recorded"};
// The mark under a day with no bar: "0" when the bot ran and found no bug, "×" when no run
// is recorded. None from KNOWN_UNTIL on (today, or once Hackbot runs), and none on a page
// that knows no daily pass.
function mark(k, total) {
  if (total || !RAN_DAYS.size) return "";
  if (RAN_DAYS.has(k)) return "0";
  return k >= KNOWN_UNTIL ? "" : "×";
}
// Bugs handled per local day, by the category of that day's newest run on each bug. The
// axis starts at the first run, and has no gaps after it.
function daily() {
  const days = DATA.periods.find(p => p.key === state.period).days;
  const first = DATA.first_run ? dayKey(DATA.first_run) : "";
  const keys = Array.from({length: days}, (_, i) => dayKey(new Date(DATA.as_of) - (days - 1 - i) * DAY_MS))
    .filter(k => k >= first);
  const perDay = Object.fromEntries(keys.map(k => [k, {}]));
  for (const b of DATA.bugs) {
    for (const r of b.runs) {  // newest first, so the first run seen on a day wins
      const k = dayKey(r.started_at);
      if (perDay[k] && !(b.bug_id in perDay[k])) perDay[k][b.bug_id] = r.category;
    }
  }
  return keys.map(k => {
    const counts = Object.fromEntries(DATA.categories.map(c =>
      [c.key, Object.values(perDay[k]).filter(cat => cat === c.key).length]));
    return {label: day(k + "T12:00:00"), mark: mark(k, Object.keys(perDay[k]).length), ...counts};
  });
}
// Draws each day's mark on the base line, in the axis font. Small on thin columns, and
// left to the tooltip when a column is too thin for a glyph.
const markPlugin = {id: "marks", afterDatasetsDraw(c) {
  const {ctx, scales: {x, y}} = c;
  const width = x.width / Math.max(1, c.data.labels.length);
  if (width < 6) return;
  ctx.save();
  ctx.font = `${width < 12 ? 9.5 : 11}px ${Chart.defaults.font.family}`;
  ctx.fillStyle = Chart.defaults.color;
  ctx.textAlign = "center";
  ctx.textBaseline = "bottom";
  c.data.datasets.at(-1).marks.forEach((m, i) => m && ctx.fillText(m, x.getPixelForValue(i), y.getPixelForValue(0) - 2));
  ctx.restore();
}};
function markSummary(perDay) {
  const out = ["Bugs handled per day."];
  for (const [m, text] of Object.entries(MARKS)) {
    const labels = perDay.filter(d => d.mark === m).map(d => d.label);
    if (labels.length) out.push(`${text}: ${labels.join(", ")}.`);
  }
  return out.join(" ");
}

function drawOverview() {
  const o = DATA.overview[state.period];
  const perDay = daily();
  document.getElementById("summary-title").textContent = `Summary (${period().label.toLowerCase()} window)`;
  // Each tile opens the Bugs view on its category.
  const share = n => o.counts.all ? `${Math.round(100 * n / o.counts.all)}% of bugs handled` : "";
  document.getElementById("summary-grid").innerHTML = CATS.map(c => `<button type="button" class="stat expandable" data-open-cat="${c}">
    <div class="label">${c === "all" ? "Bugs handled" : CAT_TEXT[c]}</div><div class="value">${o.counts[c]}</div>
    <div class="sub">${c === "all" ? "each bug once, by its newest run" : share(o.counts[c])}</div></button>`).join("");
  // The last dataset has no bars: it carries each day's mark to the plugin and the tooltip.
  const datasets = [...DATA.categories.map(c => ({label: c.label, data: perDay.map(d => d[c.key]), backgroundColor: c.color, maxBarThickness: 28})),
    {label: "", data: perDay.map(() => 0), marks: perDay.map(d => d.mark)}];
  document.getElementById("chart-daily").setAttribute("aria-label", markSummary(perDay));
  chart("chart-daily", {type: "bar", plugins: [markPlugin],
    data: {labels: perDay.map(d => d.label), datasets},
    options: {interaction: {mode: "index", intersect: false},
      plugins: {legend: {labels: {boxWidth: 10, boxHeight: 10, filter: item => !datasets[item.datasetIndex].marks}},
        tooltip: {filter: item => item.dataset.marks ? !!item.dataset.marks[item.dataIndex] : item.raw > 0,
          callbacks: {label: item => item.dataset.marks ? MARKS[item.dataset.marks[item.dataIndex]] : `${item.dataset.label}: ${item.formattedValue}`}}},
      scales: {x: {stacked: true, grid: {display: false}, ticks: {maxRotation: 0, autoSkip: true, maxTicksLimit: 10}},
        y: {stacked: true, beginAtZero: true, ticks: {precision: 0}}}}});
  horizontalBar("chart-close", o.close_kinds, CAT.close.color);
  horizontalBar("chart-severity", o.severity, CAT.analyzed.color);
  // A click on an issue type opens the Bugs view on it.
  horizontalBar("chart-issue", o.issue_types, CAT.analyzed.color, t => { openBugs("all", t); draw(); });
  const notes = o.other_notes.map(n => `${esc(n.note || "no note")} (${bug(n.bug_id)})`);
  document.getElementById("issue-notes").innerHTML = notes.length ? `Other: ${notes.join(", ")}` : "";
}

// ---- Bugs ----
// Per bug, the newest run inside the period, with the tags that depend on it.
function shown() {
  const start = period().start;
  const q = state.q.trim().toLowerCase();
  const text = b => `${b.bug_id} ${b.title} ${b.tags.join(" ")} ${b.run.outcome ?? ""} ${CAT_TEXT[b.run.category]} ${b.run.needinfo.map(ni => niLabel(ni) || "").join(" ")}`.toLowerCase();
  const matches = b => (!state.issue || b.run.issue_type === state.issue) && (!q || text(b).includes(q));
  return DATA.bugs.map(b => {
    const runs = b.runs.filter(r => r.started_at >= start);
    if (!runs.length) return null;
    // Python sends only the runs the page shows, so a second run means the bot came back.
    const run = runs[0];
    return {...b, runs, run, tags: [...b.tags, ...run.tags, ...(runs.length > 1 ? ["again"] : [])]};
  }).filter(b => b && matches(b))
    .sort((a, b) => b.run.started_at.localeCompare(a.run.started_at));
}

// One chip per person asked, as in the triage dashboard: the name, then the role.
const niLabel = ni => ni.nick ? (ni.name ? `${ni.name} (:${ni.nick})` : `:${ni.nick}`) : null;
const niChip = ni => {
  const role = esc(ROLES[ni.role]);
  return `<span class="ni-chip">${niLabel(ni) ? `${esc(niLabel(ni))}<span class="ni-role">${role}</span>` : role}</span>`;
};

// One row per change, most harmful first. Rows that take the bug off the team are red.
function changes(r) {
  const rows = [
    r.resolution && ["Closed", `${esc(r.resolution)}${r.dupe_of ? " of " + bug(r.dupe_of) : ""}`, CAT.close.harm],
    r.move_to && ["Moved", `to ${esc(r.move_to)}`, CAT.close.harm],
    (r.severity || r.priority) && ["S/P", esc([r.severity, r.priority].filter(Boolean).join(" / "))],
    r.needinfo.length && ["Needinfo", r.needinfo.map(niChip).join("")],
    r.asked.length && ["Asked for", esc(r.asked.join(", "))],
    r.blocks_add.length && ["Blocks", bugList(r.blocks_add)],
    r.regressed_by_add.length && ["Regressed by", bugList(r.regressed_by_add)],
    r.keywords_add.length && ["Keywords", esc(r.keywords_add.join(", "))],
    ...r.other_bugs.map(o => ["Meta bug", `${bugList(o.blocks_add)}, added to ${bug(o.bug_id)}`]),
  ].filter(Boolean);
  const all = rows.length ? rows : [["Changes", "comment only, no field change"]];
  return `<dl class="changes">${all.map(([k, v, harm]) => `<dt${harm ? ' class="harm"' : ""}>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
}

function railItem(b) {
  const c = b.run.category;
  return `<li><button type="button" class="rail-item${b.bug_id === state.bug ? " is-active" : ""}" data-bug="${b.bug_id}">
    <span class="rail-row1"><span class="rail-id">${b.bug_id}</span>${state.cat === "all" ? `<span class="rail-cat${harm(c)}">${esc(CAT[c].label)}</span>` : ""}
      <span class="rail-tags">${tags(b.tags, t => TAGS[t].rail)}</span></span>
    <span class="rail-title">${esc(b.title)}</span></button>${bug(b.bug_id, "bug-link rail-link")}</li>`;
}

// The list in day groups, newest first, each under a header with its bug count.
function railDays(list) {
  const groups = Map.groupBy(list, b => dayKey(b.run.started_at));
  return [...groups.values()].map(bs => `<li class="rail-group"><h3 class="rail-day">${esc(dayLabel(bs[0].run.started_at))} · ${bs.length}</h3>
    <ol>${bs.map(railItem).join("")}</ol></li>`).join("");
}

// The bot's timeline on the bug: every run in the period, newest first, each with every
// change and its whole comment.
function card(b, index, total) {
  const r = b.run;
  // What happened to the run on Bugzilla: a link to the posted comment, or the review result.
  // Hackbot keeps no comment id, so its applied runs link to the bug, not the comment.
  const anchor = e => e.comment_count ? `#c${e.comment_count}` : "";
  const outcome = e => !e.outcome ? ""
    : e.posted_at ? ` · ${link(bugUrl(b.bug_id, anchor(e)), `${esc(e.outcome)} ${esc(dayLabel(e.posted_at))} ${time(e.posted_at)}`)}`
    : ` · ${esc(e.outcome)}`;
  const source = e => HAS_HACKBOT ? ` · ${e.source === "hackbot" ? "Hackbot" : "local"}` : "";
  // Python sets `warning`. Shown at the top of the card, above the timeline.
  const NOTICES = {
    "do not apply": e => `Rejected. Do not apply this run in Hackbot: its ${e.pending_actions} pending ${e.pending_actions === 1 ? "action is" : "actions are"} still there, and applying them would post a second comment.`,
    "rejected but posted": () => "This run was rejected, but some of its actions were applied in Hackbot. Check the bug for a second comment.",
  };
  const notice = e => e.warning ? `<p class="notice">${esc(NOTICES[e.warning](e))}</p>` : "";
  const entry = e => `<li><div class="when">${esc(dayLabel(e.started_at))} ${time(e.started_at)} · ${esc(e.decision)} · ${esc(e.issue_type)}${source(e)}${e.agent_version ? ` · agent ${esc(e.agent_version)}` : ""}${outcome(e)}</div>${changes(e)}
    ${e.comment_html ? `<div class="comment">${e.comment_html}</div>` : ""}</li>`;
  return `<div class="card-top">
      <span class="card-id">${bug(b.bug_id)} ${catTag(r.category)} ${tags(b.tags)}</span>
      <span class="pos"><button type="button" data-step="-1" aria-label="Previous bug">↑</button>bug ${index + 1} of ${total}<button type="button" data-step="1" aria-label="Next bug">↓</button></span>
    </div>
    <h2 class="card-title">${esc(b.title)}</h2>
    ${b.filed ? `<p class="card-meta">Filed ${date(b.filed)} · ${waited(b.filed, b.first_run)}</p>` : ""}
    ${b.runs.map(notice).filter(Boolean).join("")}
    <ol class="timeline">${b.runs.map(entry).join("")}</ol>`;
}

let current = [];  // the list the last drawBugs() showed

function drawBugs() {
  const all = shown();
  const inCat = c => c === "all" ? all : all.filter(b => b.run.category === c);
  document.getElementById("cats").innerHTML = CATS.map(c =>
    `<button type="button" class="lw-filter" role="tab" data-cat="${c}" aria-pressed="${state.cat === c}" aria-selected="${state.cat === c}">${CAT_TEXT[c]} <span class="lw-filter-n">${inCat(c).length}</span></button>`).join("");
  document.getElementById("issue-chip").innerHTML = state.issue
    ? `<button type="button" class="lw-filter" data-clear-issue aria-label="Show every issue type">Issue: ${esc(state.issue)} ×</button>` : "";
  const list = inCat(state.cat);
  if (!list.some(b => b.bug_id === state.bug)) state.bug = list.length ? list[0].bug_id : null;
  document.getElementById("rail").innerHTML = list.length ? railDays(list)
    : `<li class="empty">${state.q ? "No bug matches the search." : "The bot handled no bug in this group in this period."} Choose “All” or a longer period.</li>`;
  const i = list.findIndex(b => b.bug_id === state.bug);
  document.getElementById("card").innerHTML = i < 0 ? `<p class="empty">Choose a bug on the left.</p>` : card(list[i], i, list.length);
  current = list;
}

// ---- Shell ----
const toggles = (list, key) => list.map(([k, l]) => `<button type="button" data-${key}="${k}" class="${state[key] === k ? "active" : ""}">${l}</button>`).join("");
function draw() {
  document.getElementById("views").innerHTML = toggles(VIEWS, "view");
  document.getElementById("periods").innerHTML = toggles(PERIODS, "period");
  document.getElementById("overview-view").hidden = state.view !== "overview";
  document.getElementById("bugs-view").hidden = state.view !== "bugs";
  if (state.view === "overview") drawOverview(); else drawBugs();
  const parts = [state.view, state.period, ...(state.view === "bugs" ? [state.cat, state.bug ?? "", state.issue] : [])];
  history.replaceState(null, "", "#" + parts.join("/"));
}

function step(n) {
  const i = current.findIndex(b => b.bug_id === state.bug);
  const next = current[i + n];
  if (!next) return;
  state.bug = next.bug_id;
  draw();
  document.querySelector(`.rail-item[data-bug="${next.bug_id}"]`)?.scrollIntoView({block: "nearest"});
}

function readHash() {
  const [view, period, cat, bugId, issue] = location.hash.slice(1).split("/");
  if (VIEWS.some(([k]) => k === view)) state.view = view;
  if (PERIODS.some(([k]) => k === period)) state.period = period;
  if (CATS.includes(cat)) state.cat = cat;
  if (bugId) state.bug = Number(bugId);
  state.issue = issue || "";
}

const cycle = (list, key, dir) => {
  const i = list.findIndex(([k]) => k === state[key]) + dir;
  if (i >= 0 && i < list.length) { state[key] = list[i][0]; draw(); }
};
const search = document.getElementById("search");
let typing;
search.addEventListener("input", () => {
  clearTimeout(typing);
  typing = setTimeout(() => { state.q = search.value; draw(); }, 120);
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-view], [data-period], [data-cat], [data-bug], [data-step], [data-open-cat], [data-clear-issue]");
  if (!el) return;
  if ("clearIssue" in el.dataset) state.issue = "";
  if (el.dataset.step) return step(Number(el.dataset.step));
  if (el.dataset.openCat) openBugs(el.dataset.openCat);
  if (el.dataset.view) state.view = el.dataset.view;
  if (el.dataset.period) state.period = el.dataset.period;
  if (el.dataset.cat) state.cat = el.dataset.cat;
  if (el.dataset.bug) state.bug = Number(el.dataset.bug);
  draw();
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.activeElement.tagName === "INPUT") {
    if (e.key === "Escape") document.activeElement.blur();
    return;
  }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    const dir = e.key === "ArrowRight" ? 1 : -1;
    return e.shiftKey ? cycle(PERIODS, "period", dir) : cycle(VIEWS, "view", dir);
  }
  if (state.view !== "bugs") return;
  if (e.key === "/") { e.preventDefault(); search.focus(); }
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); step(1); }
  if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); step(-1); }
});
window.addEventListener("hashchange", () => { readHash(); draw(); });

Chart.defaults.font.family = getComputedStyle(document.body).getPropertyValue("--mono");
Chart.defaults.font.size = 11;
Chart.defaults.color = getComputedStyle(document.body).getPropertyValue("--muted");
Chart.defaults.scale.grid.color = getComputedStyle(document.body).getPropertyValue("--rule-soft");
const asOf = new Date(DATA.as_of).toLocaleString("en-US", {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false, timeZoneName: "short"});
document.getElementById("header-meta").innerHTML = `__LABEL__ · data as of ${esc(asOf)}`
  + (DATA.posted ? ` · ${DATA.posted} ${DATA.posted === 1 ? "run" : "runs"} posted to Bugzilla` : ` · <span class="dry-run">nothing posted to Bugzilla yet</span>`)
  + (DATA.awaiting ? ` · ${DATA.awaiting} awaiting review` : "");
readHash();
draw();
</script>
</body>
