name: Build and publish

on:
  push:
    branches: [main]
  # Daily, after media-triage syncs its calendar (06:00 UTC): a new rotation week, and
  # bugs closed since the last build.
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check
      - run: uv run pytest tests/unit/ -q
      # Without network the build keeps the committed rotation and open status.
      - run: uv run python -m triagedash refresh
        continue-on-error: true
      - run: uv run python -m triagedash build --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
